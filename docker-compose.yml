version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=ticketbot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 60 1000

  backend:
    build: .
    restart: always
    ports:
      - "0.0.0.0:8000:8000"
    command: sh -c "cd backend && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/backend/staticfiles
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://postgres:postgres@db:5432/ticketbot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PYTHONPATH=/app/backend:/app
      - STATIC_ROOT=/app/backend/staticfiles
      - ALLOWED_HOSTS=localhost,127.0.0.1,151.25.69.162,hydrabot.it,www.hydrabot.it,api.hydrabot.it,hyperkinetic-unsplendorously-jessi.ngrok-free.dev
    depends_on:
      - db
      - redis

  worker_vatican:
    build: .
    restart: always
    command: celery -A backend.core worker -l info -Q vatican,celery
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/ticketbot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PYTHONPATH=/app/backend:/app
      - OXYLABS_USERNAME=${OXYLABS_USERNAME}
      - OXYLABS_PASSWORD=${OXYLABS_PASSWORD}
      - TWOCAPTCHA_API_KEY=${TWOCAPTCHA_API_KEY}
      - VATICAN_CONCURRENCY=${VATICAN_CONCURRENCY:-4}
      - VATICAN_RPS=${VATICAN_RPS:-5}
      - VATICAN_VISITORS=${VATICAN_VISITORS:-2}
    depends_on:
      - db
      - redis

  beat:
    build: .
    restart: always
    command: celery -A backend.core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/ticketbot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/app/backend:/app
    depends_on:
      - db
      - redis


  telegram_bot:
    build: .
    restart: always
    command: python /app/backend/telegram_bot.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/ticketbot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - PYTHONPATH=/app/backend:/app
      - DJANGO_SETTINGS_MODULE=core.settings
      - SERVER_BASE_URL=https://hydrabot.it
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
    depends_on:
      - backend
      - frontend

  solver:
    build: ./queue_solver
    restart: always
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis



  harvester:
    build: ./harvester
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

volumes:
  postgres_data:
    external: true
    name: root_postgres_data
  static_volume:
    external: true
    name: root_static_volume
  redis-data:
